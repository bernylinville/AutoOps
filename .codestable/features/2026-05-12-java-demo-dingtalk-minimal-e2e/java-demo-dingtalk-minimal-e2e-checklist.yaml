feature: 2026-05-12-java-demo-dingtalk-minimal-e2e
created: 2026-05-12

steps:
  - action: "Preflight 骨架：只读检查 Hermes、AutoOps、pukka-gitops、Kubespray、Jenkins、Harbor、ClusterTarget 和 Secret key 存在性"
    exit_signal: "得到一份不含 Secret 值的可触发或阻塞判断，阻塞项已归类到本 feature 战术修正或后续 roadmap item"
    status: done

  - action: "战术修正节点：只处理最小 E2E 必需的小修，例如 Hermes chatContext snake_case、Jenkinsfile 输出 IMAGE_TAG"
    exit_signal: "能构造符合 roadmap 第 4.2 节的 Agent 请求，且 Jenkins Console Output 至少有一种当前 AutoOps 可解析镜像结果"
    status: done

  - action: "真实入口触发：在钉钉群发送用户原话，由 Hermes 调 AutoOps"
    exit_signal: "群内或 Hermes 响应出现 requestNo，AutoOps 返回 workflowKind=build_deploy、mode=direct、approvalStatus=pending"
    status: done

  - action: "审批与流水线推进：审批人通过 OA，等待审批同步和 PipelineScheduler 自动执行"
    exit_signal: "状态查询显示 approvalStatus=approved，pipelineStatus 进入 building/deploying/succeeded，或失败时有明确 stage error"
    status: done

  - action: "Kubernetes 与访问验证：确认测试 namespace 中 Deployment ready、Service(type=NodePort) 存在，并验证访问 URL"
    exit_signal: "访问 http://<node-ip>:<nodePort>/ 或等价方式返回 java-demo 可识别响应，状态接口 accessInfo 包含镜像、namespace、NodePort 或 accessUrls"
    status: done

  - action: "回群与证据收尾：确认 deploy_bot 通知发送成功，并写入 feature-local 证据包"
    exit_signal: "钉钉群可见部署结果，证据包包含 requestNo、审批、Jenkins、Harbor、Kubernetes、访问 URL 和通知记录"
    status: done

