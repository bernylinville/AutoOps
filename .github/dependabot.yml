# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # Only send security updates, not general version updates.
    # Manual version updates can be done via `go get -u` when needed.
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "bernylinville"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # Only send security updates.
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "bernylinville"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "bernylinville"
