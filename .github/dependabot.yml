# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # Only send security updates, not general version updates.
    # Manual version updates can be done via `go get -u` when needed.
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "bernylinville"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # Only send security updates.
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "bernylinville"

  # GitHub Actions: optional low-frequency grouped version updates.
  # Go/npm remain security-only above to keep dependency noise low for a small team.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      # Don't update to any action release that is less than two weeks old.
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    assignees:
      - "bernylinville"
