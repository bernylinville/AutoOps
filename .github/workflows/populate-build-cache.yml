name: Populate Build Cache

on:
  push:
    branches: [master]
    paths:
      - 'api/go.mod'
      - 'api/go.sum'
      - 'web/package.json'
      - 'web/package-lock.json'
  schedule:
    - cron: "0 3 * * 1-5"  # 工作日每天凌晨 3 点 UTC
  workflow_dispatch:

jobs:
  cache-backend:
    name: Warm Go Build Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
          cache: true

      - name: Build backend
        run: |
          cd api
          go build -v ./...

  cache-frontend:
    name: Warm Frontend Build Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Build frontend
        run: |
          cd web
          npm run build
