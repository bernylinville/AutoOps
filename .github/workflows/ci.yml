name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any outstanding CI workflow runs against the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum

      - name: Go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -count=1
        env:
          # Skip tests requiring live DB unless mocked
          CI: true

  vue-checks:
    name: Vue Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

  ci-result:
    name: Check CI results
    runs-on: ubuntu-latest
    needs: [go-checks, vue-checks]
    if: ${{ !cancelled() }}
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.go-checks.result }}" != "success" ]; then
            echo "::error::Go backend checks failed"
            exit 1
          fi
          if [ "${{ needs.vue-checks.result }}" != "success" ]; then
            echo "::error::Vue frontend checks failed"
            exit 1
          fi
          echo "All CI checks passed!"
