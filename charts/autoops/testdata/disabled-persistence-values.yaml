api:
  jwtSecret: dev-jwt-secret

postgres:
  password: dev-postgres-password
  persistence:
    enabled: false

valkey:
  password: dev-valkey-password
  cacheOnly: true
  persistence:
    enabled: false

upload:
  persistence:
    enabled: false

gitopsWorkingTree:
  bootstrapMode: clone
  persistence:
    enabled: false

monitor:
  agent:
    heartbeatToken: dev-heartbeat-token

integrations:
  agent:
    bearerToken: dev-agent-bearer-token
