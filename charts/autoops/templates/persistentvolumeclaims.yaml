{{- if and .Values.upload.persistence.enabled (not .Values.upload.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "autoops.uploadClaimName" . }}
  labels:
    {{- include "autoops.labels" . | nindent 4 }}
  {{- with .Values.upload.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.upload.persistence.accessModes | nindent 4 }}
  {{- include "autoops.storageClassField" .Values.upload.persistence | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.upload.persistence.size }}
---
{{- end }}
