apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoops.fullname" . }}-api
  labels:
    {{- include "autoops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "autoops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "autoops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.api.serviceAccountName }}
      serviceAccountName: {{ .Values.api.serviceAccountName | quote }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-upload-dir
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p {{ .Values.upload.mountPath }}/xlsl"]
          volumeMounts:
            - name: upload
              mountPath: {{ .Values.upload.mountPath }}
        {{- if and .Values.gitopsWorkingTree.enabled (eq .Values.gitopsWorkingTree.bootstrapMode "clone") }}
        - name: bootstrap-gitops-working-tree
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p {{ .Values.gitopsWorkingTree.mountPath }}
              if [ ! -d {{ .Values.gitopsWorkingTree.mountPath }}/.git ]; then
                rm -rf {{ .Values.gitopsWorkingTree.mountPath }}/*
                git clone --branch {{ .Values.gitopsWorkingTree.branch | quote }} {{ .Values.gitopsWorkingTree.repoURL | quote }} {{ .Values.gitopsWorkingTree.mountPath }}
              fi
          volumeMounts:
            - name: gitops-working-tree
              mountPath: {{ .Values.gitopsWorkingTree.mountPath }}
            {{- if .Values.gitopsWorkingTree.sshSecretName }}
            - name: gitops-ssh
              mountPath: /home/devops/.ssh
              readOnly: true
            {{- end }}
        {{- end }}
      containers:
        - name: api
          image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["/bin/sh", "/app/entrypoint.sh"]
          env:
            - name: TZ
              value: {{ .Values.api.timezone | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.api.dbSslMode | quote }}
            - name: IMAGE_HOST
              value: {{ .Values.api.imageHost | quote }}
            - name: DB_HOST
              value: {{ include "autoops.postgresServiceName" . | quote }}
            - name: DB_PORT
              value: {{ .Values.service.postgres.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.username | quote }}
            - name: REDIS_ADDR
              value: {{ printf "%s:%v" (include "autoops.valkeyServiceName" .) .Values.service.valkey.port | quote }}
            - name: GITOPS_REPO_PATH
              value: {{ .Values.gitopsWorkingTree.mountPath | quote }}
            - name: HEARTBEAT_SERVER_URL
              value: {{ .Values.monitor.agent.heartbeatServerURL | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "dbPassword") | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "redisPassword") | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "jwtSecret") | quote }}
            - name: AGENT_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "agentBearerToken") | quote }}
            - name: HEARTBEAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "heartbeatToken") | quote }}
            - name: FLASHDUTY_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "flashdutyAppKey") | quote }}
            - name: FLASHDUTY_INTEGRATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "flashdutyIntegrationKey") | quote }}
            - name: DINGTALK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "dingtalkWebhookURL") | quote }}
            - name: DINGTALK_APPROVAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "dingtalkApprovalClientSecret") | quote }}
            - name: DEPLOY_BOT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "deployBotWebhookURL") | quote }}
            - name: DEPLOY_BOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "autoops.secretName" . }}
                  key: {{ include "autoops.secretKey" (dict "root" . "key" "deployBotSecret") | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /app/entrypoint.sh
              subPath: entrypoint.sh
            - name: runtime
              mountPath: /app/config.template.yaml
              subPath: config.template.yaml
            - name: upload
              mountPath: {{ .Values.upload.mountPath }}
            - name: logs
              mountPath: /app/log
            {{- if .Values.gitopsWorkingTree.enabled }}
            - name: gitops-working-tree
              mountPath: {{ .Values.gitopsWorkingTree.mountPath }}
            {{- if .Values.gitopsWorkingTree.sshSecretName }}
            - name: gitops-ssh
              mountPath: /home/devops/.ssh
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: runtime
          configMap:
            name: {{ include "autoops.fullname" . }}-api-runtime
            defaultMode: 0755
        - name: upload
          {{- if .Values.upload.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "autoops.uploadClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
        {{- if .Values.gitopsWorkingTree.enabled }}
        - name: gitops-working-tree
          {{- if .Values.gitopsWorkingTree.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "autoops.gitopsClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gitopsWorkingTree.sshSecretName }}
        - name: gitops-ssh
          secret:
            secretName: {{ .Values.gitopsWorkingTree.sshSecretName }}
            defaultMode: 0400
        {{- end }}
        {{- end }}
