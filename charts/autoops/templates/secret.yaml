{{- if eq (default "generated" .Values.secret.mode) "generated" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autoops.secretName" . }}
  labels:
    {{- include "autoops.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  REDIS_PASSWORD: {{ .Values.valkey.password | quote }}
  JWT_SECRET: {{ .Values.api.jwtSecret | quote }}
  AGENT_BEARER_TOKEN: {{ .Values.integrations.agent.bearerToken | quote }}
  HEARTBEAT_TOKEN: {{ .Values.monitor.agent.heartbeatToken | quote }}
  FLASHDUTY_APP_KEY: {{ .Values.flashduty.appKey | quote }}
  FLASHDUTY_INTEGRATION_KEY: {{ .Values.flashduty.integrationKey | quote }}
  DINGTALK_WEBHOOK_URL: {{ .Values.dingtalk.webhookURL | quote }}
  DINGTALK_APPROVAL_CLIENT_SECRET: {{ .Values.dingtalkApproval.clientSecret | quote }}
  DEPLOY_BOT_WEBHOOK_URL: {{ .Values.integrations.deployBot.webhookURL | quote }}
  DEPLOY_BOT_SECRET: {{ .Values.integrations.deployBot.secret | quote }}
{{- end }}
